<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account to report and find items on campus.">
    <title>Register - Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="style.css?v=20261112-2">
</head>

<body>
    <nav class="navbar" aria-label="Main navigation">
    <div class="logo">
        Campus <span>Lost &amp; Found</span>
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-register">Register</a>
    </div>
</nav>

    <main class="container auth-card">
        <p class="page-eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create your account</h1>
        <p class="auth-intro">Make it easier to report a missing item or help return something found on campus.</p>

        <form id="registerForm" action="register" method="post" data-csrf-managed="true">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
                minlength="3"
                maxlength="32"
                pattern="[A-Za-z0-9._-]{3,32}"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                autocomplete="email"
                required
                maxlength="254"
            >

            <label for="password">Password</label>
            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    minlength="10"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Show or hide password"
                >👁</button>
            </div>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-container">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="10"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    id="toggleConfirmPassword"
                    class="password-toggle"
                    aria-label="Show or hide confirmation password"
                >👁</button>
            </div>

            <button type="submit" class="app-submit">Create account</button>

        </form>

        <p id="message" class="form-message" role="status" aria-live="polite"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </main>
    <footer class="site-footer">
        <span>© 2026 Campus Lost &amp; Found</span>
        <a href="index.html">Campus community support</a>
    </footer>

    <script src="script.js?v=20261112-2"></script>

    <script>
        const message = document.getElementById("message");
        const params = new URLSearchParams(window.location.search);
        const registrationErrors = {
            username: "Username must be 3–32 characters using letters, numbers, dots, underscores, or hyphens.",
            email: "Enter a valid email address (maximum 254 characters).",
            password: "Password must be 10–128 characters.",
            confirmPassword: "Passwords do not match.",
            invalid: "Please review your details and try again.",
            duplicate: "Username is already registered.",
            database: "We could not create your account right now. Please try again later."
        };

        if (registrationErrors[params.get("error")]) {
            message.textContent = registrationErrors[params.get("error")];
            message.classList.add("error-message");
        }
    </script>

    <script src="csrf.js?v=20261112-2"></script>
</body>
</html>
